[package]
name = "ember-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Phoenix Rise SDK (public crate). Pinned until we explicitly bump.
phoenix-rise = "=0.3.4"

# Web framework
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br", "compression-gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# State
dashmap = "6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async utilities
futures = "0.3"

# Solana types (matching SDK versions)
solana-pubkey = { version = "~3.0", features = ["curve25519"] }
solana-instruction = { version = "~3.0", default-features = false, features = ["std"] }

# Encoding
base64 = "0.22"

# HTTP (for proxying perp-api endpoints the SDK doesn't wrap, e.g. /v1/invite/check)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Release-build tuning to keep the static binary footprint small on Render's
# 512MB starter instance. `strip = true` removes debuginfo (~30MB savings on
# Rust release binaries that pull in solana-sdk + phoenix-rise). `lto = "thin"`
# is a cheap dead-code elimination pass that also reduces the binary; "fat"
# would shave a bit more but balloons build time and we hit Render's 10-min
# build cap on the starter plan.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
phoenix-rise-litesvm-test = "=0.3.4"
